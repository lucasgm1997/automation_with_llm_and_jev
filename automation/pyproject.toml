[project]
name = "jev-flutter-e2e"
version = "0.1.0"
description = "Bounded semantic UI runner for Flutter, Marionette and Jev"
requires-python = ">=3.11"
dependencies = ["httpx[http2]>=0.28,<1", "mcp>=1.20,<2", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
