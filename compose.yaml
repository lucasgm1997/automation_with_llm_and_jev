name: flutter-e2e

services:
  jev-e2e:
    build:
      context: .
      dockerfile: automation/Dockerfile
    image: flutter-e2e-mcp:local
    init: true
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      MARIONETTE_BIN: /usr/local/bin/marionette_mcp
      JEV_ANDROID_PREPARE_ENABLED: "0"
      ANDROID_ADB_SERVER_HOST: "${ANDROID_ADB_SERVER_HOST:-host.docker.internal}"
      ANDROID_ADB_SERVER_PORT: "${ANDROID_ADB_SERVER_PORT:-5037}"
    command: ["serve", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: ./automation/.env
        target: /app/automation/.env
        read_only: true
        bind:
          create_host_path: false
      - ./automation/artifacts:/app/automation/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
